services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      VDTP_HOST: 0.0.0.0
      VDTP_PORT: "8000"
      VDTP_DATA: /data
    volumes:
      - vdtp-data:/data
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ${HOME}/.config/vdtp/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  vdtp-data:
